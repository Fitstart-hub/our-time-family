name: Deploy family PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract family-only website
        run: |
          mkdir site
          python3 - <<'PYCODE'
          import base64, glob, hashlib, io, lzma, zipfile
          data = ''.join(open(p).read().strip() for p in sorted(glob.glob('package-part-*.txt')))
          package = lzma.decompress(base64.b64decode(data))
          assert hashlib.sha256(package).hexdigest() == '6b91f8a1704cfacdfb27c8332cedecbb2dad425077ae010cc0b5fa9ab13c6795'
          zipfile.ZipFile(io.BytesIO(package)).extractall('site')
          PYCODE
          test -f site/index.html
          test -f site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
